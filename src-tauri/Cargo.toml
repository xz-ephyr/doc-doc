[package]
name = "doc-doc"
version = "0.1.0"
description = "doc-doc — tiny markdown writer, file lives on your machine"
authors = ["doc-doc"]
edition = "2021"
repository = "https://github.com/xz-ephyr/doc-doc"
license = "MIT"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-updater = "2.10.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
