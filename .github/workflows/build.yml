name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run build

      # PR / push to main: verify Tauri builds (no Release)
      - name: Build Tauri (verify)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag v* (e.g. v0.1.0): build + create Draft Release with Windows installers
      - name: Build Tauri + Release
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "doc-doc v__VERSION__"
          releaseBody: "Tiny markdown writer — file stays on your machine.\n\nWindows: download .msi or .exe (NSIS) below. Works on Windows 10 1809+ and Windows 11 — WebView2 bootstrapper is embedded so it installs automatically if missing."
          releaseDraft: true
          prerelease: false

      - name: Upload bundle as artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: |
            src-tauri/target/release/bundle/
            dist/
          if-no-files-found: warn
